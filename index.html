<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>深層心理カウンセリング・自己受容アナライザー</title>
    <style>
        :root {
            --bg-color: #f7f8fa;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --text-sub: #7f8c8d;
            --primary: #34495e;
            --primary-hover: #2c3e50;
            --accent: #2980b9;
            --border: #e2e8f0;
            --warning-bg: #fff5f5;
            --warning-border: #feb2b2;
            --warning-text: #c53030;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 680px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            padding: 32px;
            box-sizing: border-box;
            margin: 16px;
        }

        header {
            text-align: center;
            margin-bottom: 28px;
        }

        header h1 {
            font-size: 1.4rem;
            color: var(--primary);
            margin: 0 0 8px 0;
            font-weight: 600;
        }

        header p {
            font-size: 0.9rem;
            color: var(--text-sub);
            margin: 0;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--primary);
        }

        textarea {
            width: 100%;
            height: 140px;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            resize: vertical;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 14px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:disabled {
            background-color: #cbd5e1;
            cursor: not-allowed;
        }

        .result-section {
            margin-top: 32px;
            border-top: 1px solid var(--border);
            padding-top: 24px;
            display: none;
        }

        .result-box {
            background: #f8fafc;
            border-radius: 8px;
            padding: 20px;
            font-size: 0.95rem;
            line-height: 1.7;
            white-space: pre-wrap;
            border-left: 4px solid var(--accent);
        }

        .warning-box {
            background: var(--warning-bg);
            border: 1px solid var(--warning-border);
            color: var(--warning-text);
            border-radius: 8px;
            padding: 20px;
            font-size: 0.95rem;
            line-height: 1.7;
        }

        .loading {
            text-align: center;
            color: var(--text-sub);
            font-size: 0.9rem;
            margin-top: 16px;
            display: none;
        }

        .ad-space {
            margin-top: 32px;
            border: 1px dashed var(--border);
            border-radius: 8px;
            height: 90px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-sub);
            font-size: 0.8rem;
            background: #fafafa;
        }
    </style>
</head>

    <div class="container">
        <header>
            <h1>深層心理アナライザー</h1>

        </header>

        <main>

            </div>

            <button id="analyzeBtn" onclick="processConsultation()">分析を開始する</button>
            <div id="loadingText" class="loading">心を整え、深層心理を分析しています...</div>

            <div id="resultSection" class="result-section">
                <div id="resultContainer"></div>
            </div>
        </main>

        <div class="ad-space">

    </div>
